[package]
name = "lantern-core"
version.workspace = true
edition.workspace = true

[dependencies]
lantern-proto.workspace = true
lantern-crypto.workspace = true
lantern-discovery.workspace = true
lantern-transport.workspace = true
lantern-store.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
anyhow.workspace = true
uuid.workspace = true
quinn.workspace = true
hex.workspace = true
rand.workspace = true
blake3 = { workspace = true, features = ["mmap", "rayon"] }

# `libc` only — for gethostname(3). Anything else that lands under here stops
# existing on Windows: blake3 sat at the end of [dependencies] when this
# section was appended below it, which quietly moved it into the unix-only
# set and left lantern-core unable to compile for Windows at all.
[target.'cfg(unix)'.dependencies]
libc.workspace = true
