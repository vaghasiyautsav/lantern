name: CI

# Builds the three platform artifacts and enforces the quality bar from
# NOTES.md: cargo test green, cargo clippy clean.
#
# Windows is covered twice on purpose. `windows-msvc` builds natively and
# ships nothing — it is the proof the engine compiles with the real Microsoft
# toolchain. `windows` cross-builds the package people actually download,
# using the same packaging/make-windows.sh anyone can run by hand.
#
# Neither builds lantern-gtk: there is no native Windows shell yet, so what
# ships is the engine plus the localhost interface.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Note: deliberately no global RUSTFLAGS. `-D warnings` there applies to
  # dependencies as well, so an upstream crate's warning would fail our
  # build; it also changes the cache key on every toolchain bump. The bar is
  # enforced on the clippy invocation instead, where it belongs.

jobs:
  check:
    name: test + clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # 24.04 ships GTK 4.14. The Linux shell links it directly, so the
      # workspace does not build without the dev package.
      - name: GTK4 development files
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev
      - run: cargo test --workspace
      # NOTES.md's bar is "clippy clean", so a warning is a failure.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  linux:
    name: linux (.deb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: GTK4 development files
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev
      - run: cargo build --release
      - name: Package
        run: bash packaging/make-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lantern-deb
          path: "*.deb"
          if-no-files-found: error

  macos:
    name: macos (.dmg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # make-dmg.sh builds only lantern-gui and lantern-cli, then compiles
      # the SwiftUI shell with the swiftc that ships in the runner's Xcode.
      # It deliberately does not touch lantern-gtk.
      - name: Build and package
        run: bash packaging/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lantern-dmg
          path: "*.dmg"
          if-no-files-found: error

  # Proves the engine really builds with the native MSVC toolchain. It
  # ships nothing: three bare .exes are not a package, and the artifact a
  # person downloads is built by the job below from the project's own script.
  windows-msvc:
    name: windows (msvc build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # ring assembles its primitives with NASM on windows-msvc, and the
      # runner does not ship it — the first run failed in exactly this step.
      # ring arrives via quinn and rustls, so it is not optional for us.
      - name: NASM (ring builds its assembly with it)
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH
      # No lantern-gtk: there is no Windows shell yet. rusqlite is vendored
      # and builds SQLite from source with MSVC, so no system SQLite is
      # needed. SO_REUSEPORT is already cfg-gated away in lantern-discovery.
      - run: cargo build --release -p lantern-cli -p lantern-gui

  # The shippable Windows package, cross-built on Linux by the same script a
  # person runs by hand. Loose .exes would drop a Windows user straight into
  # a console that looks like it does nothing; this carries Start-Lantern.cmd
  # and a README that says where the window is.
  windows:
    name: windows (.zip)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: mingw-w64 and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip
      - run: rustup target add x86_64-pc-windows-gnu
      - name: Package
        run: bash packaging/make-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lantern-windows
          path: dist/lantern-windows-x64.zip
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, linux, macos, windows, windows-msvc]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # gh is preinstalled on the runner, so this needs no third-party
      # release action and no token beyond the one GitHub already provides.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find artifacts -type f -print
          gh release create "${GITHUB_REF_NAME}" \
            --title "Lantern ${GITHUB_REF_NAME}" \
            --notes "Unsigned builds. macOS: right-click → Open on first launch. See README." \
            $(find artifacts -type f)
