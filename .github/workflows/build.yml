# Builds Lantern on all three platforms and keeps the artifacts.
#
# This exists for Windows above all. macOS and Linux are built by hand on the
# two working copies (install.sh), so their job here is to catch the thing a
# single-machine session can't: that the *other* platform still compiles. On
# 18 Aug 2026 a Mac session shipped GTK code it had no way to build, and a
# Linux session shipped a shell macOS can't compile — this is the check that
# would have caught both.
#
# Windows has no native shell yet (DESIGN §5.3 has WinUI as future work), so
# the Windows artifact is the engine plus the localhost interface: run
# lantern-gui.exe and the window is a browser at http://localhost:3999. That
# is a real, usable Lantern on Windows — and it is honest about being the
# interim shell rather than pretending a native one exists.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A build that only fails in release is a bad surprise at packaging time.
  RUSTFLAGS: -D warnings

jobs:
  engine:
    name: engine · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the others: knowing whether the
      # break is everywhere or only on Windows is most of the diagnosis.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # build.rs stamps the commit into the binary; a shallow clone with
          # no history still has HEAD, which is all it reads.
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # The GTK shell is Linux-only and needs GTK 4.10+. Everywhere else it is
      # excluded rather than skipped silently, so a missing exclude shows up as
      # a failure instead of quietly untested code.
      - name: GTK development files (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev

      - name: Test
        run: cargo test --workspace --exclude lantern-gtk

      - name: Test the GTK shell too (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p lantern-gtk

      - name: Clippy
        run: cargo clippy --workspace --exclude lantern-gtk --all-targets

      - name: Build release binaries
        run: cargo build --release -p lantern-gui -p lantern-cli

      - name: Build the GTK shell (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --release -p lantern-gtk

      # Windows: the two exes plus a one-line launcher, which is the whole
      # "app" until a native shell exists. Named for the platform so a
      # download is unambiguous about what it runs on.
      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist/lantern-windows
          cp target/release/lantern-gui.exe dist/lantern-windows/
          cp target/release/lantern.exe dist/lantern-windows/
          cp target/release/lantern-doctor.exe dist/lantern-windows/
          cat > dist/lantern-windows/Start-Lantern.cmd <<'CMD'
          @echo off
          rem Starts the engine and opens the interface. Localhost only:
          rem nothing outside this machine can reach the window.
          start "" "%~dp0lantern-gui.exe"
          timeout /t 2 >nul
          start "" http://localhost:3999
          CMD
          cat > dist/lantern-windows/README.txt <<'TXT'
          Lantern for Windows (interim shell)
          -----------------------------------
          Double-click Start-Lantern.cmd. The engine starts and your browser
          opens http://localhost:3999 — that page is the app, and only this
          machine can reach it.

          Windows Firewall will ask once: allow it on private networks, or
          nobody on your LAN can see you. Lantern needs UDP 3939 for
          discovery and one UDP port for QUIC transfers.

          There is no native Windows window yet. Everything else is the same
          engine the Mac and Linux apps use: no server, no accounts, nothing
          leaves the LAN.
          TXT

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: lantern-windows
          path: dist/lantern-windows
          if-no-files-found: error

      - name: Upload Linux binaries
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: lantern-linux
          path: |
            target/release/lantern-gui
            target/release/lantern
            target/release/lantern-doctor
            target/release/lantern-gtk
          if-no-files-found: error

      # macOS: the .app is built by install.sh / make-dmg.sh on the owner's
      # Mac. All CI needs to prove here is that the Swift shell still
      # compiles, which no Linux session can check.
      - name: Compile the SwiftUI shell (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          swiftc -parse-as-library -O \
            -target "$(uname -m)-apple-macos13.0" \
            -o /tmp/LanternShell apps/macos-native/Lantern.swift

  # Artifacts from a branch build expire and need a GitHub login to fetch. A
  # tag gets a release instead: a plain URL anyone can download from, which is
  # the difference between "there's a build somewhere" and "here's the zip".
  #
  #   git tag v0.1.1 && git push origin v0.1.1
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: engine
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lantern-windows
          path: lantern-windows

      - name: Zip it
        run: zip -qr lantern-windows-x64.zip lantern-windows

      - uses: softprops/action-gh-release@v2
        with:
          files: lantern-windows-x64.zip
          # Draft, not published: the release notes are a person's job, and a
          # tag pushed by accident shouldn't announce itself.
          draft: true
          body: |
            Windows build (interim shell): unzip and run `Start-Lantern.cmd`.
            The engine starts and the interface opens at http://localhost:3999.

            macOS and Linux build from source with `install.sh`.
