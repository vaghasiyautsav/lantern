<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    Lantern icon — "Kept Flame", Indian form: the akash kandil.
    The star lantern hung at the threshold during Diwali: lit paper,
    eight points, streamers in the night breeze. One glowing star,
    kept close. Nothing else.
  -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#20284a"/>
      <stop offset="0.5" stop-color="#171e38"/>
      <stop offset="1"   stop-color="#0d1124"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#ffd9a0" stop-opacity="0.45"/>
      <stop offset="0.35" stop-color="#ffb454" stop-opacity="0.20"/>
      <stop offset="0.7" stop-color="#8f7ce0" stop-opacity="0.06"/>
      <stop offset="1"   stop-color="#4a5aa8" stop-opacity="0"/>
    </radialGradient>

    <!-- Lit paper: white-gold heart to saffron to crimson point-tips -->
    <radialGradient id="paper" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#fff3d8"/>
      <stop offset="0.3"  stop-color="#ffce75"/>
      <stop offset="0.62" stop-color="#ff9e3d"/>
      <stop offset="0.85" stop-color="#ef6c2a"/>
      <stop offset="1"    stop-color="#d84f26"/>
    </radialGradient>

    <linearGradient id="tassel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffb454" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#ff9e3d" stop-opacity="0.5"/>
      <stop offset="1"   stop-color="#ff9e3d" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232"/>
    </clipPath>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- night -->
    <rect width="1024" height="1024" fill="url(#field)"/>

    <!-- radiance -->
    <circle cx="512" cy="470" r="470" fill="url(#glow)"/>

    <!-- cord and loop -->
    <circle cx="512" cy="78" r="16" fill="none" stroke="#4d5788" stroke-width="12"/>
    <line x1="512" y1="94" x2="512" y2="208" stroke="#4d5788" stroke-width="10"
          stroke-linecap="round"/>

    <!-- halo behind the star -->
    <circle cx="512" cy="470" r="200" fill="#ff9e3d" opacity="0.30" filter="url(#soft)"/>

    <!-- the kandil: eight points — tall, wide, and four short diagonals -->
    <path d="M 512 210
             L 547 385 L 624 358 L 597 435 L 742 470
             L 597 505 L 624 582 L 547 555 L 512 730
             L 477 555 L 400 582 L 427 505 L 282 470
             L 427 435 L 400 358 L 477 385 Z"
          fill="url(#paper)"/>

    <!-- fold lines: the paper's craft, barely there -->
    <g stroke="#a83a1e" stroke-width="5" opacity="0.28" stroke-linecap="round">
      <line x1="512" y1="470" x2="512" y2="222"/>
      <line x1="512" y1="470" x2="512" y2="718"/>
      <line x1="512" y1="470" x2="294" y2="470"/>
      <line x1="512" y1="470" x2="730" y2="470"/>
      <line x1="512" y1="470" x2="616" y2="366"/>
      <line x1="512" y1="470" x2="616" y2="574"/>
      <line x1="512" y1="470" x2="408" y2="366"/>
      <line x1="512" y1="470" x2="408" y2="574"/>
    </g>

    <!-- the flame heart at the star's centre -->
    <circle cx="512" cy="470" r="72" fill="#fff3d8" opacity="0.85"/>
    <circle cx="512" cy="470" r="44" fill="#fffdf5"/>

    <!-- streamers, hanging from the star's lower points -->
    <rect x="500" y="726" width="24" height="178" rx="12" fill="url(#tassel)"/>
    <rect x="391" y="576" width="18" height="142" rx="9" fill="url(#tassel)"
          transform="rotate(-8 400 580)"/>
    <rect x="615" y="576" width="18" height="142" rx="9" fill="url(#tassel)"
          transform="rotate(8 624 580)"/>
  </g>
</svg>
