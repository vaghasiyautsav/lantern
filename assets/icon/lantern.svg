<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Night field: deep indigo, faintly lifted at the top -->
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#232c4e"/>
      <stop offset="0.5" stop-color="#181f3a"/>
      <stop offset="1"   stop-color="#0e1226"/>
    </linearGradient>

    <!-- Patient concentric glow: amber core through blue bridge to night -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#ffd9a0" stop-opacity="0.55"/>
      <stop offset="0.28" stop-color="#ffb454" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#8f7ce0" stop-opacity="0.10"/>
      <stop offset="0.8"  stop-color="#4a5aa8" stop-opacity="0.04"/>
      <stop offset="1"    stop-color="#4a5aa8" stop-opacity="0"/>
    </radialGradient>

    <!-- The flame core -->
    <radialGradient id="core" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0"    stop-color="#fff3d8"/>
      <stop offset="0.45" stop-color="#ffcf7d"/>
      <stop offset="0.8"  stop-color="#ff9e3d"/>
      <stop offset="1"    stop-color="#f27c2a"/>
    </radialGradient>

    <!-- Vessel body: warm-lit paper, darker at the hem -->
    <linearGradient id="vessel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#3a4472"/>
      <stop offset="0.45" stop-color="#333c68"/>
      <stop offset="1"    stop-color="#262e52"/>
    </linearGradient>

    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232"/>
    </clipPath>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- night field -->
    <rect width="1024" height="1024" fill="url(#field)"/>

    <!-- graduated radiance, optically centred (slightly above geometric) -->
    <circle cx="512" cy="488" r="470" fill="url(#glow)"/>

    <!-- others warmed by the same light: felt before seen -->
    <g stroke="#93a7ef" stroke-width="7" fill="none" stroke-linecap="round">
      <path d="M 186 488 A 326 326 0 0 1 234 348" opacity="0.20"/>
      <path d="M 838 488 A 326 326 0 0 0 790 348" opacity="0.20"/>
      <path d="M 128 560 A 388 388 0 0 1 170 396" opacity="0.10"/>
      <path d="M 896 560 A 388 388 0 0 0 854 396" opacity="0.10"/>
    </g>

    <!-- hanging loop, seated into the cap -->
    <path d="M 466 246 Q 512 190 558 246" fill="none"
          stroke="#4d5788" stroke-width="26" stroke-linecap="round"/>

    <!-- cap -->
    <rect x="418" y="240" width="188" height="52" rx="26" fill="#4d5788"/>

    <!-- vessel: superellipse silhouette -->
    <path d="M 512 300
             C 384 300 306 386 306 502
             C 306 622 390 706 512 706
             C 634 706 718 622 718 502
             C 718 386 640 300 512 300 Z"
          fill="url(#vessel)"/>

    <!-- paper ribs: beneath the light, so the flame always wins -->
    <g stroke="#141a33" stroke-width="14" fill="none" opacity="0.45"
       stroke-linecap="round">
      <path d="M 330 420 Q 512 386 694 420"/>
      <path d="M 318 502 Q 512 472 706 502"/>
      <path d="M 334 586 Q 512 560 690 586"/>
    </g>

    <!-- kept flame: halo then core, above everything the vessel holds -->
    <circle cx="512" cy="496" r="150" fill="#ff9e3d" opacity="0.35" filter="url(#soft2)"/>
    <circle cx="512" cy="496" r="122" fill="url(#core)"/>
    <circle cx="512" cy="496" r="122" fill="none" stroke="#ffe9c2"
            stroke-width="3" opacity="0.5"/>

    <!-- rim light on the vessel from its own flame -->
    <path d="M 512 300
             C 384 300 306 386 306 502
             C 306 622 390 706 512 706
             C 634 706 718 622 718 502
             C 718 386 640 300 512 300 Z"
          fill="none" stroke="#8b96c9" stroke-width="6" opacity="0.55"/>

    <!-- base -->
    <rect x="446" y="712" width="132" height="44" rx="22" fill="#4d5788"/>

    <!-- warm pool beneath -->
    <ellipse cx="512" cy="800" rx="190" ry="26" fill="#ff9e3d"
             opacity="0.14" filter="url(#soft)"/>
  </g>
</svg>
